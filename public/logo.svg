<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Fundo Preto Sólido (Garante contraste no ícone) -->
  <rect width="512" height="512" fill="#020617"/>
  
  <!-- Grupo Centralizado -->
  <g transform="translate(256 256)">
    <!-- Borda da Tampinha (Cinza Metálico) -->
    <!-- Reduzido para r=190 para garantir margem de segurança (Safe Zone) -->
    <circle r="190" fill="#94a3b8"/>
    
    <!-- Detalhe da Borda (Anel mais escuro para dar profundidade sem usar sombra complexa) -->
    <circle r="180" fill="#cbd5e1"/>
    
    <!-- Interior da Tampinha (Vermelho da Marca) -->
    <circle r="160" fill="#b91c1c"/>
    
    <!-- Letra B (Branco Puro) - Desenhada manualmente no centro -->
    <path fill="#ffffff" d="M-35 -70 H 25 C 55 -70 75 -50 75 -20 C 75 0 60 15 40 20 C 65 25 80 45 80 75 C 80 110 55 130 15 130 H -35 V -70 Z M 0 -40 V 10 H 25 C 40 10 45 0 45 -15 C 45 -30 40 -40 25 -40 H 0 Z M 0 40 V 100 H 30 C 50 100 50 90 50 70 C 50 50 45 40 30 40 H 0 Z" transform="translate(-15 -10)"/>
  </g>
</svg>