
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#ef4444">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/beer.png">
    <link rel="manifest" href="manifest.json">
    <title>Botequista - Gestão de Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                barrio: ['Barrio', 'system-ui', 'cursive'],
                mono: ['Courier New', 'Courier', 'monospace'],
              },
              colors: {
                slate: {
                  950: '#020617',
                }
              }
            }
          }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Barrio&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            --sb-track: #f1f5f9;
            --sb-thumb: #cbd5e1;
            --sb-size: 10px;
            scrollbar-gutter: stable;
        }

        .dark {
            --sb-track: #020617;
            --sb-thumb: #1e293b;
        }

        html, body {
            scrollbar-width: thin;
            scrollbar-color: var(--sb-thumb) var(--sb-track);
            overflow-x: hidden;
            background-color: #f8fafc;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #root {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .dark body {
            background-color: #020617;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        ::-webkit-scrollbar { 
            width: var(--sb-size); 
            height: var(--sb-size);
        }
        ::-webkit-scrollbar-track { 
            background: var(--sb-track); 
        }
        ::-webkit-scrollbar-thumb { 
            background: var(--sb-thumb); 
            border-radius: 10px;
            border: 2px solid var(--sb-track);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .serrated-top-black { position: relative; }
        .serrated-top-black:before {
            content: ""; position: absolute; top: -10px; left: 0; width: 100%; height: 10px;
            background: linear-gradient(-135deg, transparent 5px, black 0), linear-gradient(135deg, transparent 5px, black 0);
            background-size: 10px 10px; background-repeat: repeat-x;
        }
        .serrated-bottom-black { position: relative; }
        .serrated-bottom-black:after {
            content: ""; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px;
            background: linear-gradient(-45deg, transparent 5px, black 0), linear-gradient(45deg, transparent 5px, black 0);
            background-size: 10px 10px; background-repeat: repeat-x;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "crypto-js": "https://esm.sh/crypto-js@^4.2.0",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.11"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado com sucesso!', reg))
                    .catch(err => console.log('Falha ao registrar Service Worker:', err));
            });
        }
    </script>
</body>
</html>
