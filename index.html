
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botequista - Gestão de Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                retro: ['"Press Start 2P"', 'cursive'],
              },
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Tema Retro 8-bit Alegre e Divertido */
        .retro {
            --pixel-blue: #3db1ff;   /* Azul céu vibrante */
            --pixel-green: #00a800;  /* Verde grama clássico */
            --pixel-red: #ff0000;    /* Vermelho intenso */
            --pixel-yellow: #ffff00; /* Amarelo moeda */
            --pixel-white: #ffffff;
            --pixel-black: #000000;
            
            background-color: var(--pixel-blue) !important;
            font-family: 'Press Start 2P', cursive !important;
        }
        
        .retro * {
            image-rendering: pixelated;
            border-radius: 0 !important;
        }
        
        .retro h1, .retro h2, .retro h3, .retro span, .retro p, .retro label, .retro button, .retro input, .retro select {
            text-transform: uppercase;
            font-size: 0.75rem !important;
            letter-spacing: 0px;
            color: var(--pixel-black);
        }
        
        .retro .bg-white, .retro .bg-slate-900, .retro .bg-slate-50 {
            background-color: var(--pixel-white) !important;
            border: 4px solid var(--pixel-black) !important;
            box-shadow: 8px 8px 0 var(--pixel-black) !important;
        }
        
        .retro button {
            border: 4px solid var(--pixel-black) !important;
            box-shadow: 4px 4px 0 var(--pixel-black) !important;
            background-color: var(--pixel-red) !important;
            color: var(--pixel-white) !important;
            padding: 10px 16px !important;
        }
        
        .retro button:hover {
            background-color: var(--pixel-green) !important;
        }
        
        .retro button:active {
            box-shadow: 0 0 0 var(--pixel-black) !important;
            transform: translate(4px, 4px);
        }
        
        .retro input, .retro select {
            border: 4px solid var(--pixel-black) !important;
            background-color: var(--pixel-white) !important;
            color: var(--pixel-black) !important;
        }
        
        .retro header {
            background-color: var(--pixel-white) !important;
            border-bottom: 6px solid var(--pixel-black) !important;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        
        .retro aside {
            background-color: var(--pixel-green) !important;
            border-right: 6px solid var(--pixel-black) !important;
        }
        
        .retro aside span, .retro aside svg {
            color: var(--pixel-white) !important;
        }
        
        .retro .text-red-600, .retro .text-red-400, .retro .text-emerald-500 {
            color: var(--pixel-red) !important;
            font-weight: 900;
        }

        .retro .bg-red-600 {
            background-color: var(--pixel-red) !important;
        }

        /* Transição suave */
        * {
            transition-property: background-color, border-color, color, transform, box-shadow;
            transition-timing-function: steps(4, end); /* Animação em passos para o estilo retro */
            transition-duration: 150ms;
        }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--pixel-black); }
        ::-webkit-scrollbar-thumb { background: var(--pixel-yellow); border: 2px solid var(--pixel-black); }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
