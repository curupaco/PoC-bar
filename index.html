
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botequista - Gestão de Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                barrio: ['Barrio', 'system-ui', 'cursive'],
                retro: ['"Press Start 2P"', 'cursive'],
                mono: ['Courier New', 'Courier', 'monospace'],
              },
            }
          }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Press+Start+2P&family=Barrio&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            --sb-track: #f1f5f9;
            --sb-thumb: #cbd5e1;
            --sb-size: 10px;
            scrollbar-gutter: stable;
        }

        .dark {
            --sb-track: #0f172a;
            --sb-thumb: #334155;
        }

        html, body {
            scrollbar-width: thin;
            scrollbar-color: var(--sb-thumb) var(--sb-track);
            overflow-x: hidden;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        ::-webkit-scrollbar { 
            width: var(--sb-size); 
            height: var(--sb-size);
        }
        ::-webkit-scrollbar-track { 
            background: var(--sb-track); 
        }
        ::-webkit-scrollbar-thumb { 
            background: var(--sb-thumb); 
            border-radius: 10px;
            border: 2px solid var(--sb-track);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Efeito Serrilhado do Cupom */
        .serrated-top {
            position: relative;
        }
        .serrated-top:before {
            content: "";
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(-135deg, transparent 5px, white 0), linear-gradient(135deg, transparent 5px, white 0);
            background-size: 10px 10px;
            background-repeat: repeat-x;
        }
        .serrated-bottom {
            position: relative;
        }
        .serrated-bottom:after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(-45deg, transparent 5px, white 0), linear-gradient(45deg, transparent 5px, white 0);
            background-size: 10px 10px;
            background-repeat: repeat-x;
        }
    </style>
