
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botequista - Gestão de Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                retro: ['"Press Start 2P"', 'cursive'],
              },
            }
          }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --sb-track: #f1f5f9;
            --sb-thumb: #94a3b8;
            --sb-size: 12px;
        }

        .dark {
            --sb-track: #0f172a;
            --sb-thumb: #475569;
        }

        html, body {
            scrollbar-width: auto;
            scrollbar-color: var(--sb-thumb) var(--sb-track);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-y: scroll;
        }
        
        ::-webkit-scrollbar { 
            width: var(--sb-size) !important; 
            height: var(--sb-size) !important;
            display: block !important;
        }
        ::-webkit-scrollbar-track { 
            background: var(--sb-track) !important; 
        }
        ::-webkit-scrollbar-thumb { 
            background: var(--sb-thumb) !important; 
            border-radius: 10px !important;
            border: 3px solid var(--sb-track) !important;
        }

        /* Remove arrows from number inputs */
        input.no-spinner::-webkit-outer-spin-button,
        input.no-spinner::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input.no-spinner {
            -moz-appearance: textfield;
        }

        .retro {
            --pixel-blue: #3db1ff;
            --pixel-green: #00a800;
            --pixel-red: #ff0000;
            --pixel-yellow: #ffff00;
            --pixel-white: #ffffff;
            --pixel-black: #000000;
            background-color: var(--pixel-blue) !important;
            font-family: 'Press Start 2P', cursive !important;
        }
        .retro * { image-rendering: pixelated; border-radius: 0 !important; }
        .retro h1, .retro h2, .retro h3, .retro span, .retro p, .retro label, .retro button, .retro input, .retro select {
            text-transform: uppercase; font-size: 0.75rem !important; color: var(--pixel-black);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
