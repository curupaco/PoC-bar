  <noscript>
    <div style="font-family:sans-serif;max-width:800px;margin:40px auto;padding:24px;line-height:1.6;color:#0f172a">
      <h1>Botequista — O Sistema Inteligente para Bares e Botecos</h1>
      <p><strong>Fácil igual seu caderninho. Esperto igual dono de bar.</strong></p>
      <p>O Botequista é a plataforma completa de gestão de bares, PDV de balcão e mesas, fechamento cego de caixa, controle de penduras no WhatsApp, monitor de cozinha e conciliação de cartões com maquininhas REDE (Itaú).</p>
      <h2>Principais Recursos do Sistema:</h2>
      <ul>
        <li><strong>Salão & Balcão:</strong> Lançamento de pedidos em 2 segundos, radar de mesas sem consumo e divisão de contas simplificada.</li>
        <li><strong>Gaveta Blindada:</strong> Fechamento cego de turno no escuro (o caixa conta sem ver o esperado) e controle de sangrias.</li>
        <li><strong>Cozinha & Copo:</strong> Monitor de pedidos em tempo real com campainha para o garçom e ficha técnica de drinks fracionados.</li>
        <li><strong>Conciliação REDE:</strong> Auditoria automática de taxas de cartão (MDR) e previsão de recebíveis bancários.</li>
        <li><strong>Offline First:</strong> Funciona mesmo quando a internet do bar cai.</li>
      </ul>
      <p>Acesse <a href="https://botequista.com.br/landing">botequista.com.br/landing</a> para conhecer todos os detalhes.</p>
    </div>
  </noscript>
