
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#ef4444">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="manifest" href="manifest.json">
    <title>Botequista - Gestão de Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              fontFamily: {
                sans: ['Inter', 'sans-serif'],
                barrio: ['Barrio', 'system-ui', 'cursive'],
              },
            }
          }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Barrio&display=swap" rel="stylesheet" crossorigin="anonymous">
    <style>
        :root {
            --sb-track: #f1f5f9;
            --sb-thumb: #cbd5e1;
            --sb-size: 10px;
            scrollbar-gutter: stable;
        }

        .dark {
            --sb-track: #020617;
            --sb-thumb: #1e293b;
        }

        html, body {
            scrollbar-width: thin;
            scrollbar-color: var(--sb-thumb) var(--sb-track);
            overflow-x: hidden;
            width: 100%;
            height: 100%;
        }

        #root {
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        ::-webkit-scrollbar { 
            width: var(--sb-size); 
            height: var(--sb-size);
        }
        ::-webkit-scrollbar-track { 
            background: var(--sb-track); 
        }
        ::-webkit-scrollbar-thumb { 
            background: var(--sb-thumb); 
            border-radius: 10px;
            border: 2px solid var(--sb-track);
        }
    </style>
